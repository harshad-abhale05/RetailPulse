name: RetailPulse Data Pipeline

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "sql/**"
      - "requirements.txt"
      - ".github/workflows/retailpulse.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-pipeline:
    name: Execute Bronze to Gold Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download Olist dataset
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          kaggle datasets download \
            -d olistbr/brazilian-ecommerce \
            -p data/raw \
            --unzip \
            --force

      - name: Verify source datasets
        run: |
          echo "Checking Olist CSV files..."

          files=(
            olist_customers_dataset.csv
            olist_geolocation_dataset.csv
            olist_order_items_dataset.csv
            olist_order_payments_dataset.csv
            olist_order_reviews_dataset.csv
            olist_orders_dataset.csv
            olist_products_dataset.csv
            olist_sellers_dataset.csv
            product_category_name_translation.csv
          )

          for file in "${files[@]}"; do
            if [[ ! -f "data/raw/$file" ]]; then
              echo "MISSING: $file"
              exit 1
            fi
            echo "FOUND: $file"
          done

          echo "All 9 source datasets verified."

      - name: Execute RetailPulse pipeline
        run: |
          python src/run_pipeline.py

      - name: Upload pipeline outputs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: retailpulse-pipeline-outputs
          path: data/processed/
          retention-days: 7
          if-no-files-found: error
